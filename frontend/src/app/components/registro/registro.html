<div class="auth-container">
  <div class="auth-card">
    <h2>BIENVENIDO</h2>
    <p class="subtitle">Aplicación Control de Gastos</p>

    <!-- Pestañas activas para Registro -->
    <div class="tabs">
      <button class="tab-btn" type="button" [routerLink]="['/login']">INICIAR SESIÓN</button>
      <button class="tab-btn active" type="button">REGISTRARSE</button>
    </div>

    <form (ngSubmit)="onRegistro()" class="auth-form" autocomplete="off">
      <!-- Nombre -->
      <div class="input-group">
        <div class="icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <input 
          type="text" 
          [(ngModel)]="nombre" 
          name="nombre" 
          placeholder="Nombre" 
          autocomplete="off" 
          required>
      </div>

      <!-- Apellido -->
      <div class="input-group">
        <div class="icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <input 
          type="text" 
          [(ngModel)]="apellido" 
          name="apellido" 
          placeholder="Apellido" 
          autocomplete="off" 
          required>
      </div>

      <!-- Correo electrónico -->
      <div class="input-group">
        <div class="icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
        <input 
          type="email" 
          [(ngModel)]="correo" 
          name="correo" 
          placeholder="Correo electrónico" 
          autocomplete="off" 
          required>
      </div>

      <!-- Contraseña -->
      <div class="input-group">
        <div class="icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <input 
          [type]="mostrarPassword ? 'text' : 'password'" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="Contraseña" 
          autocomplete="new-password" 
          required>
        <button type="button" class="toggle-password" (click)="mostrarPassword = !mostrarPassword">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <p *ngIf="errorMensaje" class="error-text">{{ errorMensaje }}</p>

      <button type="submit" class="btn-primary">REGISTRARSE</button>
    </form>

    <div class="divider"><span>o</span></div>

    <div id="googleBtn" class="google-btn-container"></div>

    <p class="switch-link">
      ¿Ya tienes una cuenta? <a [routerLink]="['/login']">Inicia sesión</a>
    </p>
  </div>
</div>
