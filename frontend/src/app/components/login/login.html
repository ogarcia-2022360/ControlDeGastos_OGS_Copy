<div class="login-container">
  <div class="login-card">
    <h2>BIENVENIDO</h2>
    <p class="subtitle">Aplicacion Control de Gastos</p>

    <!-- Campo de Usuario con icono -->
    <div class="input-container">
      <div class="icon-bubble left-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <input type="text" [(ngModel)]="username" placeholder="Usuario" (keyup.enter)="onLogin()" />
    </div>

    <!-- Campo de Contraseña con icono -->
    <div class="input-container">
      <input type="password" [(ngModel)]="password" placeholder="Contraseña" (keyup.enter)="onLogin()" />
      <div class="icon-bubble right-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
    </div>

    <button (click)="onLogin()">INGRESAR</button>

    @if (error) {
      <div class="error-msg">Usuario o contraseña incorrectos</div>
    }
  </div>
</div>
