<div class="login-container">
  <div class="login-card">
    <h1 class="title">BIENVENIDO</h1>
    <p class="subtitle">Aplicación Control de Gastos</p>

    <div class="tabs">
      <button class="tab-btn active" type="button">INICIAR SESIÓN</button>
      <button class="tab-btn" type="button" [routerLink]="['/registro']">REGISTRARSE</button>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="input-group">
        <span class="input-icon">
          <i class="fas fa-envelope"></i>
        </span>
        <input
          type="email"
          name="username"
          [(ngModel)]="credentials.username"
          placeholder="Correo electrónico"
          required
        />
      </div>

      <div class="input-group">
        <span class="input-icon">
          <i class="fas fa-lock"></i>
        </span>
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="credentials.password"
          placeholder="Contraseña"
          required
        />
        <span class="toggle-password" (click)="mostrarPassword = !mostrarPassword">
          <i [class]="mostrarPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
        </span>
      </div>

      <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

      <button type="submit" class="submit-btn">INGRESAR</button>
    </form>

    <div class="divider">
      <span>o</span>
    </div>

    <div id="googleBtn" class="google-btn-container"></div>

    <p class="footer-text">
      ¿No tienes una cuenta? <a [routerLink]="['/registro']">Regístrate</a>
    </p>
  </div>
</div>
